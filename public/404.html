<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecionando...</title>
    <script>
      // Redireciona para index.html preservando o caminho da rota
      const l = window.location;
      // Extrai o path relativo a /Kachat/
      const pathname = l.pathname.replace(/^\/Kachat/, '');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/Kachat/?p=' + encodeURIComponent(pathname) +
        l.search + l.hash
      );
    </script>
  </head>
  <body>
    Redirecionando...
  </body>
</html>
